[platformio]
default_envs = pager1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SH110X
  h2zero/NimBLE-Arduino@^2.3.7

; Pager #1 — original Bluetooth Mini Keyboard
[env:pager1]
build_flags =
  -DPAGER_KEYBOARD_ADDRESS=\"E8:74:76:2D:CF:DB\"
  -DPAGER_KEYBOARD_ADDRESS_PREFIX=\"E8:74:76:2D:CF:D\"
  -DPAGER_DEVICE_ID=1
  -DPAGER_PEER_ID=2
  -DPAGER_DEVICE_NAME=\"Pager1\"
  -DPAGER_PEER_NAME=\"Pager2\"

; Pager #2 — K808
[env:pager2]
build_flags =
  -DPAGER_KEYBOARD_ADDRESS=\"41:83:6B:99:22:04\"
  -DPAGER_DEVICE_ID=2
  -DPAGER_PEER_ID=1
  -DPAGER_DEVICE_NAME=\"Pager2\"
  -DPAGER_PEER_NAME=\"Pager1\"
