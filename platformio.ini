[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 2MB
board_build.partitions = partitions.csv
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SH110X
  https://github.com/tanakamasayuki/EspBle.git#56e288da27032e5b0e77f53dcb85a7d85c8fff22

lib_ldf_mode = deep+
lib_archive = no
; EspBle ships its Classic host as an Arduino precompiled archive.
; PlatformIO needs the archive's search path and name explicitly.
build_flags =
  -L${platformio.libdeps_dir}/${this.__env__}/EspBle/src/esp32
  -lespble_bluedroid_classic
